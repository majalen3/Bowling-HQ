name: Feature Request\ndescription: Suggest a new feature or enhancement\ntitle: \"[FEATURE] \"\nlabels: [\"enhancement\"]\nbody:\n  - type: markdown\n    attributes:\n      value: |\n        Thanks for the feature suggestion! Help us understand your idea.\n  - type: textarea\n    id: description\n    attributes:\n      label: Description\n      description: What feature would you like to see?\n      placeholder: \"Describe the feature...\"\n    validations:\n      required: true\n  - type: textarea\n    id: problem\n    attributes:\n      label: Problem It Solves\n      description: What problem does this solve? Why is it valuable?\n      placeholder: \"This would help because...\"\n    validations:\n      required: true\n  - type: textarea\n    id: solution\n    attributes:\n      label: Proposed Solution\n      description: How would this work? How would users interact with it?\n      placeholder: \"The feature would work like...\"\n    validations:\n      required: true\n  - type: textarea\n    id: alternatives\n    attributes:\n      label: Alternatives Considered\n      description: Other approaches or features you considered\n      placeholder: \"Other options...\"\n  - type: textarea\n    id: examples\n    attributes:\n      label: Examples or Use Cases\n      description: Real-world examples of how this would be used\n      placeholder: \"Example: When I'm bowling at...\"\n  - type: dropdown\n    id: impact\n    attributes:\n      label: Impact Level\n      description: How important is this feature?\n      options:\n        - High (Core functionality)\n        - Medium (Nice to have)\n        - Low (Polish/Nice idea)\n    validations:\n      required: true\n"