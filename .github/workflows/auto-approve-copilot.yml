name: Auto-approve Copilot CI

on:
  workflow_run:
    workflows:
      - CI
    types:
      - requested

permissions:
  actions: write
  contents: read

jobs:
  approve:
    if: ${{ github.event.workflow_run.actor.id == 198982749 && github.event.workflow_run.actor.type == 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Approve Copilot-triggered CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run approve ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}
