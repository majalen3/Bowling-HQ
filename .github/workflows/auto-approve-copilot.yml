name: Auto-approve Copilot CI

on:
  workflow_run:
    workflows:
      - CI
    types:
      - requested

permissions:
  actions: write
  contents: read

jobs:
  approve:
    if: ${{ github.event.workflow_run.actor.login == 'Copilot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve Copilot-triggered CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run approve ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}
