name: Auto-approve Copilot workflow runs

on:
  workflow_run:
    workflows:
      - CI
    types:
      - requested

permissions:
  actions: write
  contents: read

jobs:
  approve:
    # 198982749 is the Copilot SWE Agent GitHub App bot account ID.
    # Verify via https://api.github.com/users/Copilot if GitHub changes this actor.
    if: ${{ github.event.workflow_run.actor.id == 198982749 && github.event.workflow_run.actor.type == 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Approve Copilot-triggered CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Approving run ${{ github.event.workflow_run.id }} in ${{ github.repository }}"
          gh run approve ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}
          echo "Approval request submitted."
