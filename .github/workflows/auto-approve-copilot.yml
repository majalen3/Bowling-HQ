name: Auto-approve GitHub Copilot workflow runs

on:
  workflow_run:
    workflows:
      - CI
    types:
      - requested

permissions:
  actions: write
  contents: read

jobs:
  approve:
    # 198982749 is the GitHub user ID for the @copilot app account.
    # Verify via https://api.github.com/users/copilot if this actor changes.
    if: ${{ github.event.workflow_run.actor.id == 198982749 && github.event.workflow_run.actor.type == 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve Copilot-triggered CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "Approving run ${{ github.event.workflow_run.id }} in ${{ github.repository }}"
          gh api \
            --method POST \
            /repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/approve
          echo "Approval request submitted."
